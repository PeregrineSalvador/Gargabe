version: '3.8'

services:
  garbage-service:
    build:
      context: ..
      dockerfile: Dockerfile
    image: garbage:latest
    container_name: garbage-detection
    
    # 1. 挂载项目根目录
    # 如果你的 docker-compose.yml 在项目根目录下的 .devcontainer 文件夹中：
    # 使用 ../ 映射到容器的 /workspace，就等于把整个项目根目录塞进去了
    volumes:
      - ..:/workspace
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # 额外挂载系统的设备目录（配合 privileged 即可读写所有外设）
      - /dev:/dev

    environment:
      - DISPLAY=${DISPLAY}
      - NVIDIA_VISIBLE_DEVICES=all
    # runtime: nvidia
    
    # 2. 开启特权模式与全硬件访问
    privileged: true
    # 推荐使用 host 网络模式，这能让容器直接访问宿主机的 X11 显示服务和网络外设
    network_mode: "host"
    
    stdin_open: true
    tty: true
    command: /bin/bash

# 注意：使用了 network_mode: "host" 后，不再需要下方自定义的 bridge 网络