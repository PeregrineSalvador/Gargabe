<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>垃圾分类控制系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        header {
            text-align: center;
            padding: 20px 0;
            margin-bottom: 20px;
            border-bottom: 2px solid #0f3460;
        }
        header h1 {
            font-size: 2.5em;
            color: #e94560;
            text-shadow: 0 0 10px rgba(233, 69, 96, 0.5);
        }
        .main-content {
            display: grid;
            grid-template-columns: 800px 360px;
            gap: 20px;
            align-items: start;
        }
        .video-section {
            background: #0f3460;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            width: 800px;
            flex-shrink: 0;
        }
        .video-section h2 {
            margin-bottom: 15px;
            color: #00d9ff;
            font-size: 1.3em;
        }
        .video-container {
            position: relative;
            width: 760px;
            height: 480px;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
        }
        .video-container video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }
        .video-container img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }
        .status-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
        }
        .status-item {
            margin: 5px 0;
        }
        .status-label {
            color: #888;
        }
        .status-value {
            font-weight: bold;
            margin-left: 5px;
        }
        .state-standby { color: #ffa500; }
        .state-detecting { color: #00ff00; }
        .state-waiting_audit { color: #ffff00; }
        .state-error_correct { color: #ff0000; }
        
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 360px;
            flex-shrink: 0;
        }
        .panel {
            background: #0f3460;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            width: 360px;
        }
        .panel h2 {
            margin-bottom: 15px;
            color: #00d9ff;
            font-size: 1.2em;
        }
        .image-panel {
            height: 280px;
        }
        .image-container {
            position: relative;
            width: 100%;
            height: 180px;
            background: #1a1a2e;
            border-radius: 10px;
            overflow: hidden;
            border: 2px dashed #0f3460;
        }
        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .image-placeholder {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #888;
        }
        .placeholder-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }
        .image-placeholder p {
            font-size: 0.9em;
        }
        .result-info {
            margin-top: 12px;
            padding: 10px;
            background: #1a1a2e;
            border-radius: 8px;
            text-align: center;
        }
        .result-info p {
            font-size: 1.1em;
            font-weight: bold;
            color: #00d9ff;
        }
        
        .log-panel {
            height: 300px;
        }
        .log-container {
            background: #1a1a2e;
            border-radius: 10px;
            padding: 12px;
            height: 220px;
            overflow-y: auto;
            font-family: 'Consolas', monospace;
            font-size: 12px;
        }
        .log-entry {
            padding: 8px 10px;
            margin: 5px 0;
            background: #0f3460;
            border-radius: 5px;
            border-left: 3px solid #00d9ff;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .log-time {
            color: #888;
            margin-right: 10px;
        }
        .log-msg {
            color: #fff;
        }
        
        .instructions {
            background: #0f3460;
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            width: 1180px;
            height: 160px;
        }
        .instructions h2 {
            color: #00d9ff;
            margin-bottom: 12px;
            font-size: 1.2em;
        }
        .instruction-grid {
            display: flex;
            justify-content: space-around;
            gap: 12px;
            flex-wrap: nowrap;
        }
        .instruction-item {
            background: #1a1a2e;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            height: 80px;
        }
        .instruction-item .gesture {
            font-size: 1.5em;
            margin-bottom: 5px;
        }
        .instruction-item p {
            color: #aaa;
            font-size: 0.75em;
        }
        
        .log-container::-webkit-scrollbar {
            width: 8px;
        }
        .log-container::-webkit-scrollbar-track {
            background: #1a1a2e;
            border-radius: 4px;
        }
        .log-container::-webkit-scrollbar-thumb {
            background: #0f3460;
            border-radius: 4px;
        }
        .log-container::-webkit-scrollbar-thumb:hover {
            background: #e94560;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🗑️ 智能垃圾分类控制系统</h1>
        </header>
        
        <div class="main-content">
            <div class="video-section">
                <h2>📹 实时监控</h2>
                <div class="video-container">
                    <img id="video-feed" src="/video_feed" alt="Video Feed">
                </div>
            </div>
            
            <div class="sidebar">
                <div class="panel image-panel">
                    <h2>🗑️ 识别结果</h2>
                    <div class="image-container">
                        <img id="garbage-image" src="" alt="识别的垃圾图片" />
                        <div class="image-placeholder" id="image-placeholder">
                            <div class="placeholder-icon">📷</div>
                            <p>等待识别...</p>
                        </div>
                    </div>
                    <div class="result-info">
                        <p id="current-result">None</p>
                    </div>
                </div>
                
                <div class="panel log-panel">
                    <h2>📝 系统日志</h2>
                    <div class="log-container" id="log-container">
                        <div class="log-entry">
                            <span class="log-time">--:--:--</span>
                            <span class="log-msg">系统启动中...</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="instructions">
            <h2>📖 操作指南</h2>
            <div class="instruction-grid">
                <div class="instruction-item">
                    <div class="gesture">✊</div>
                    <p>握拳 - 复位系统</p>
                </div>
                <div class="instruction-item">
                    <div class="gesture">🖐️</div>
                    <p>五指 - 开始识别</p>
                </div>
                <div class="instruction-item">
                    <div class="gesture">👌</div>
                    <p>OK - 确认通过</p>
                </div>
                <div class="instruction-item">
                    <div class="gesture">🤟</div>
                    <p>ILY - 进入纠错</p>
                </div>
                <div class="instruction-item">
                    <div class="gesture">☝️</div>
                    <p>一指 - 可回收物</p>
                </div>
                <div class="instruction-item">
                    <div class="gesture">✌️</div>
                    <p>二指 - 厨余垃圾</p>
                </div>
                <div class="instruction-item">
                    <div class="gesture">👎</div>
                    <p>三指 - 有害垃圾</p>
                </div>
                <div class="instruction-item">
                    <div class="gesture">🖖</div>
                    <p>四指 - 其他垃圾</p>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let lastLogCount = 0;
        let serviceAvailable = true;
        let statusInterval = null;
        let logsInterval = null;
        
        function showServiceDown() {
            if (serviceAvailable) {
                serviceAvailable = false;
                const container = document.getElementById('log-container');
                const entry = document.createElement('div');
                entry.className = 'log-entry';
                entry.style.borderLeftColor = '#ff0000';
                entry.innerHTML = `
                    <span class="log-time">${new Date().toLocaleTimeString()}</span>
                    <span class="log-msg" style="color: #ff0000;">⚠️ 服务已断开连接</span>
                `;
                container.insertBefore(entry, container.firstChild);
                
                // 停止定时请求
                if (statusInterval) clearInterval(statusInterval);
                if (logsInterval) clearInterval(logsInterval);
                
                // 尝试重新连接
                setTimeout(tryReconnect, 3000);
            }
        }
        
        function tryReconnect() {
            fetch('/status')
                .then(response => response.json())
                .then(data => {
                    serviceAvailable = true;
                    const container = document.getElementById('log-container');
                    const entry = document.createElement('div');
                    entry.className = 'log-entry';
                    entry.style.borderLeftColor = '#00ff00';
                    entry.innerHTML = `
                        <span class="log-time">${new Date().toLocaleTimeString()}</span>
                        <span class="log-msg" style="color: #00ff00;">✅ 服务已重新连接</span>
                    `;
                    container.insertBefore(entry, container.firstChild);
                    
                    // 重新启动定时请求
                    startIntervals();
                })
                .catch(err => {
                    setTimeout(tryReconnect, 3000);
                });
        }
        
        function startIntervals() {
            statusInterval = setInterval(updateStatus, 200);
            logsInterval = setInterval(updateLogs, 500);
        }
        
        function updateStatus() {
            fetch('/status')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('current-result').textContent = data.result || 'None';
                    
                    if (data.image_url) {
                        const img = document.getElementById('garbage-image');
                        const placeholder = document.getElementById('image-placeholder');
                        img.src = data.image_url;
                        img.style.display = 'block';
                        placeholder.style.display = 'none';
                    }
                })
                .catch(err => showServiceDown());
        }
        
        function updateLogs() {
            fetch('/logs')
                .then(response => response.json())
                .then(data => {
                    if (data.length > lastLogCount) {
                        const container = document.getElementById('log-container');
                        const newLogs = data.slice(lastLogCount);
                        
                        newLogs.forEach(log => {
                            const entry = document.createElement('div');
                            entry.className = 'log-entry';
                            entry.innerHTML = `
                                <span class="log-time">${log.time}</span>
                                <span class="log-msg">${log.msg}</span>
                            `;
                            container.insertBefore(entry, container.firstChild);
                        });
                        
                        lastLogCount = data.length;
                        
                        while (container.children.length > 50) {
                            container.removeChild(container.lastChild);
                        }
                    }
                })
                .catch(err => showServiceDown());
        }
        
        // 初始化
        updateStatus();
        updateLogs();
        startIntervals();
    </script>
</body>
</html>
